<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HybridHELIX Consulting</title>
  <meta http-equiv="refresh" content="3;url=https://hybridhelix.consulting">
  <link rel="canonical" href="https://hybridhelix.consulting">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="HybridHELIX Consulting - Reimagining Business for a Better World">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100vh;
      background: #0a0e14;
      color: #f0f4f8;
      overflow: hidden;
    }
    .container {
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.8s ease forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .company-name {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
      color: #f0f4f8;
    }
    .tagline {
      font-size: 1rem;
      font-weight: 400;
      color: #4dbfe0;
      margin-bottom: 2.5rem;
      letter-spacing: 0.01em;
    }
    .redirect-notice {
      font-size: 0.85rem;
      color: rgba(240, 244, 248, 0.5);
    }
    .redirect-notice a {
      color: #4dbfe0;
      text-decoration: none;
    }
    .redirect-notice a:hover {
      text-decoration: underline;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="HybridHELIX">
    </div>
    <h1 class="company-name">HybridHELIX Consulting</h1>
    <p class="tagline">Reimagining Business for a Better World</p>
    <p class="redirect-notice">Redirecting to <a href="https://hybridhelix.consulting">hybridhelix.consulting</a>...</p>
  </div>
  <script>
    setTimeout(function() {
      window.location.replace('https://hybridhelix.consulting');
    }, 2500);
  </script>
</body>
</html>
