<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HybridHELIX Consulting</title>
  <meta http-equiv="refresh" content="3;url=https://hybridhelix.consulting">
  <link rel="canonical" href="https://hybridhelix.consulting">
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0a0e14;
      color: #f0f4f8;
      overflow: hidden;
    }
    .container {
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.2s forwards;
    }
    .logo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
    }
    .logo-wrapper img {
      width: 80px;
      height: 80px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      object-fit: contain;
    }
    .spinner {
      position: absolute;
      top: 0;
      left: 0;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(77, 191, 224, 0.1);
      border-top-color: #4dbfe0;
      animation: spin 1.2s linear infinite;
    }
    .spinner-outer {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 1px solid rgba(140, 198, 63, 0.08);
      border-bottom-color: rgba(140, 198, 63, 0.4);
      animation: spin 2.4s linear infinite reverse;
    }
    .company-name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
      color: #f0f4f8;
    }
    .tagline {
      font-size: 0.95rem;
      font-weight: 400;
      color: rgba(240, 244, 248, 0.6);
      margin-bottom: 2.5rem;
      font-style: italic;
    }
    .progress-bar {
      width: 200px;
      height: 3px;
      background: rgba(77, 191, 224, 0.15);
      border-radius: 3px;
      margin: 0 auto;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4dbfe0, #8cc63f);
      border-radius: 3px;
      animation: fillBar 3s ease-in-out forwards;
    }
    .redirect-text {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: rgba(240, 244, 248, 0.35);
    }
    .redirect-text a {
      color: #4dbfe0;
      text-decoration: none;
    }
    .redirect-text a:hover {
      text-decoration: underline;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fillBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
    }
    .glow-cyan {
      background: #4dbfe0;
      top: -100px;
      right: -50px;
    }
    .glow-lime {
      background: #8cc63f;
      bottom: -100px;
      left: -50px;
    }
  </style>
</head>
<body>
  <div class="glow glow-cyan"></div>
  <div class="glow glow-lime"></div>
  <div class="container">
    <div class="logo-wrapper">
      <div class="spinner-outer"></div>
      <div class="spinner"></div>
      <img src="/logo.png" alt="HybridHELIX Consulting">
    </div>
    <div class="company-name">HybridHELIX Consulting</div>
    <div class="tagline">Reimagining Business for a Better World</div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <p class="redirect-text">Taking you to <a href="https://hybridhelix.consulting">hybridhelix.consulting</a></p>
  </div>
  <script>
    setTimeout(function() {
      window.location.replace('https://hybridhelix.consulting');
    }, 3000);
  </script>
</body>
</html>
